[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "question-3-semantic-search"
version = "0.1.0"
description = "Semantic search with LangChain, Transformer embeddings, and Pinecone"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-pinecone>=0.2,<1.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pinecone>=6.0,<8.0",
    "pydantic-settings>=2.6,<3.0",
    "openai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
